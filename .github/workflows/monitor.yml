name: Market Monitor Bot

on:
  # Il cron ogni 30 minuti e' stato disattivato: il report giornaliero
  # (daily_report.yml) lo sostituisce con un unico messaggio piu' completo.
  # Rimane disponibile solo l'avvio manuale, se vuoi testare o usarlo ancora.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salva lo stato (evita notifiche duplicate)
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Aggiorna stato segnali [skip ci]"
          git push
          
